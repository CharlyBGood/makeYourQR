<!DOCTYPE html>
<html lang="es" class="scrollbar-custom">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAgICAAP///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIgEgICAQACAgAQICAgIiAgABIgACEAAiAAIAIAIAAAABICICACICIiAQAREQABIBIQIiIiAQIgIAIQAgAiIgIAEiICIgEgICIgACAAIgIgAAAAACABAgIgEhIgAiICACIhIBIAEAECAAASACIBIAACACIREhASACIgAAAAAiACIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      rel="icon"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>QR Maker - Genera códigos QR personalizados</title>
    <meta
      name="description"
      content="Genera códigos QR personalizados con texto, enlaces e imágenes en segundos."
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script
      src="https://kit.fontawesome.com/a9d601c6bd.js"
      crossorigin="anonymous"
    ></script>
    <script defer src="main.js"></script>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="Navegación principal">
      <h1 class="navbar-brand">
        <span>QR_Maker</span>
        <span class="brand-by">by</span>
        <a
          href="https://sinapsialab.com/"
          class="gradient-link"
          target="_blank"
          rel="noopener noreferrer"
        >SinapsiaLab</a>
      </h1>
      <button 
        id="toggle-mode" 
        class="btn-retro"
        type="button"
        aria-label="Cambiar entre modo claro y oscuro"
        title="Cambiar tema"
      >
        <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
      </button>
    </nav>
    
    <main class="container" role="main">
      <form 
        method="get" 
        action="" 
        id="form" 
        class="form card-retro"
        novalidate
        aria-labelledby="form-title"
      >
        <h2 id="form-title" class="sr-only">Generador de código QR</h2>
        
        <label for="url">Escribe el texto o enlace para tu QR</label>
        <input
          type="text"
          class="input-retro"
          name="url"
          id="url"
          placeholder="https://ejemplo.com o tu texto aquí"
          aria-describedby="url-help"
          required
          autocomplete="url"
        />
        <small id="url-help" class="sr-only">
          Ingresa cualquier texto, enlace web, número de teléfono o email
        </small>
        
        <label for="upload" class="file-label btn-retro" tabindex="0">
          <i class="fa-solid fa-image" aria-hidden="true"></i>
          Agrega un logo a tu QR (opcional)
          <input
            type="file"
            accept="image/jpeg,image/jpg,image/png,image/gif,image/webp"
            onchange="loadFile(event)"
            name="imagen"
            id="upload"
            aria-describedby="file-help"
          />
        </label>
        <small id="file-help" class="sr-only">
          Formatos soportados: JPG, PNG, GIF, WebP. Tamaño máximo: 5MB
        </small>

        <div id="logo-controls" class="logo-controls" hidden>
          <label for="logo-zoom">Encuadre del logo</label>
          <div class="logo-zoom-control">
            <input id="logo-zoom" type="range" min="75" max="150" step="5" value="100" />
            <output id="logo-zoom-value" for="logo-zoom">100%</output>
          </div>
        </div>

        <button 
          id="btn" 
          class="btn btn-retro" 
          type="submit"
          aria-describedby="btn-help"
        >
          <i class="fa-solid fa-qrcode" aria-hidden="true"></i>
          Generar QR
        </button>
        <small id="btn-help" class="sr-only">
          Genera tu código QR personalizado
        </small>
      </form>

      <section 
        id="container_qr" 
        class="container_qr card-retro"
        aria-labelledby="qr-title"
        role="region"
      >   
         <div id="qr-canvas">
        <div id="qr-output" aria-hidden="true"></div>
          <div id="qr-logo-plate" class="qr-logo-plate qr_logo_hidden" aria-hidden="true">
            <img id="qr_logo" src="" alt="" />
          </div>
       </div>
        <button 
          id="save_qr" 
          class="share btn-retro"
          type="button"
          style="display: none;"
          aria-label="Copiar o compartir código QR"
        >
          <i class="fa-solid fa-share action-btn" aria-hidden="true"></i>
          Copiar o compartir QR
        </button>
        <p id="share-status" class="share-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer>
      <p class="footer-copy">
        © <span id="current-year"></span> Creado con ❤️ por
        <a
          href="https://sinapsialab.com/"
          class="gradient-link"
          target="_blank"
          rel="noopener noreferrer"
        >SinapsiaLab</a>
      </p>
    </footer>
  </body>
</html>
